name: Docker Build CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VITE_API_URL: http://127.0.0.1:8000/api

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build backend Docker image
        run: docker build -t workflowhub-backend:ci ./backend


      - name: Run backend tests
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci-test-secret-key \
            -e DJANGO_DEBUG=False \
            workflowhub-backend:ci \
            python manage.py test userauth workflows

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            -t workflowhub-frontend:ci ./frontend

      - name: Show built images
        run: docker image ls --filter "reference=workflowhub-*"